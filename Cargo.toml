[package]
name = "forhowlong"
version = "0.1.0"
edition = "2024"

authors = ["Nathan West <Lucretiel@gmail.com>"]
readme = "./README.md"
license = "MPL-2.0"
description = "Parsable durations for configuration files, CLI arguments, and environment variables"
repository = "https://github.com/Lucretiel/forhowlong"

rust-version = "1.99"

[dependencies]
ascii-digit = "1.0.0"

[dev-dependencies]
const_format = { version = "0.2.37", default-features = false, features = ["fmt"] }
